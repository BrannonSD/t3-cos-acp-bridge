name: Verify Windows bridge
on:
  push:
  pull_request:
jobs:
  audit-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:public
      - run: npm run check
      - run: npm test
      - run: npm run build
